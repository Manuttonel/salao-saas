# Blueprint do Render (https://render.com): cria o servidor do backend (Flask).
#
# O BANCO DE DADOS fica no Supabase (PostgreSQL) e o FRONTEND na Vercel
# (pasta "frontend"). Aqui só entra o servidor.
#
# Variáveis marcadas com "sync: false" são segredos: preencha no painel do
# Render depois de criar o Blueprint (nunca ficam no repositório):
#   DATABASE_URL   string de conexão do Supabase — use a "Session pooler"
#                  (Project Settings > Database > Connect > Session pooler).
#                  NÃO use a "Direct connection": ela é só IPv6 e o Render
#                  não alcança.
#   FRONTEND_URL   endereço do site na Vercel (ex.: https://meusalao.vercel.app);
#                  pode listar vários separados por vírgula
#   MERCADOPAGO_*  quando for ativar a cobrança real
#
# Atenção ao plano: o plano gratuito do Render "dorme" após 15 min sem uso, o
# que atrasa o primeiro acesso e IMPEDE os lembretes automáticos de WhatsApp e
# o recebimento de mensagens do bot. Para uso real, use um plano pago.

services:
  - type: web
    name: salao-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: WHATSAPP_MODO_SIMULACAO
        value: "true"
      - key: WHATSAPP_WEBHOOK_TOKEN
        generateValue: true
      - key: PLATFORM_SUBSCRIPTION_PRICE
        value: "99.90"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_WEBHOOK_URL
        sync: false
